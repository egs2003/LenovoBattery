name: Build

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2

      - name: Tests
        run: cargo test --release

      - name: Build
        run: cargo build --release

      - uses: actions/upload-artifact@v4
        with:
          name: legion-battery
          path: target/release/legion-battery.exe

      # Release v<Version aus Cargo.toml> mit der exe. Die App prueft beim Start dieses Release auf
      # Updates. Eine neue Version wird also nur erkannt, wenn die Version in Cargo.toml erhoeht wurde;
      # bei gleicher Version wird die exe im bestehenden Release ersetzt.
      - name: Version lesen
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        id: ver
        shell: bash
        run: echo "version=$(grep -m1 '^version' Cargo.toml | sed -E 's/^version *= *"([^"]+)".*/\1/')" >> "$GITHUB_OUTPUT"

      - name: Release veroeffentlichen
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.ver.outputs.version }}
          name: v${{ steps.ver.outputs.version }}
          target_commitish: ${{ github.sha }}
          body: ${{ github.event.head_commit.message }}
          make_latest: true
          files: target/release/legion-battery.exe
